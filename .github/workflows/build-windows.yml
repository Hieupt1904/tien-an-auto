name: Build Windows EXE

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Job chinh: dong goi .exe. Khong cho LibreOffice (cham, khong can de build).
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cai phu thuoc build + test
        run: python -m pip install --upgrade pip pyinstaller openpyxl

      - name: Chay test (khong can mang)
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/run_all.py

      - name: Dong goi TienAn.exe
        shell: cmd
        run: tools\tao_exe.bat

      - name: Smoke test ban dong goi
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/smoke_exe.py dist/TienAn.exe

      - name: Luu artifact
        uses: actions/upload-artifact@v4
        with:
          name: TienAn-windows
          path: dist/TienAn.exe
          if-no-files-found: error

  # Job rieng: kiem vien o THAT bang LibreOffice. Chay song song voi build.
  verify-borders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cai openpyxl + LibreOffice
        run: |
          python -m pip install --upgrade pip openpyxl
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-calc > /dev/null

      - name: Kiem vien o bang LibreOffice
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/test_borders.py

  # Phat hanh: CHI chay khi CA HAI job tren deu thanh cong.
  # Truoc day buoc phat hanh nam trong job build nen co the day .exe len
  # Release truoc khi verify-borders kip ket luan (va van o do du no fail).
  release:
    needs: [build, verify-borders]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tai artifact da build
        uses: actions/download-artifact@v4
        with:
          name: TienAn-windows
          path: dist

      - name: Xac nhan co dung file .exe
        run: |
          set -euo pipefail
          ls -l dist
          test -f dist/TienAn.exe
          head -c 2 dist/TienAn.exe | grep -q "MZ"
          echo "Da xac nhan dist/TienAn.exe la file PE (MZ header)"

      - name: Gan vao Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TienAn.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
