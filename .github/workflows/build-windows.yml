name: Build Windows EXE

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cai phu thuoc build + test
        run: python -m pip install --upgrade pip pyinstaller openpyxl

      - name: Cai LibreOffice (de kiem vien o that)
        run: choco install libreoffice-fresh -y --no-progress
        continue-on-error: true

      - name: Chay test (khong can mang)
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/run_all.py

      - name: Dong goi TienAn.exe
        shell: cmd
        run: tools\tao_exe.bat

      - name: Smoke test ban dong goi
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/smoke_exe.py dist/TienAn.exe

      - name: Luu artifact
        uses: actions/upload-artifact@v4
        with:
          name: TienAn-windows
          path: dist/TienAn.exe
          if-no-files-found: error

      - name: Gan vao Release (khi co tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TienAn.exe
          generate_release_notes: true
